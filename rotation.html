<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CM 발표 일정 · CM Library</title>
<meta name="description" content="Culture Master 발표자 순환 일정과 진행 현황.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f7fb;--fg:#13233c;--muted:#6b7890;--line:#d9e1ec;--panel:#fff;--navy:#102a50;--blue:#2467c9;--yellow:#ffd04a;--soft:#eef3f9;--radius:18px;--sans:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}.shell{width:min(1100px,100% - 40px);margin:0 auto;padding:40px 0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:28px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;font-weight:700}.top h1{margin:0 0 8px;font-size:44px;line-height:1.1}.lead{margin:0;color:var(--muted)}a.back{border:1px solid var(--line);border-radius:999px;background:#fff;color:#515154;padding:8px 14px;text-decoration:none;font-size:13px;font-weight:600}.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:22px;margin-bottom:18px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{border-radius:14px;background:#fbfbfd;border:1px solid #e8e8ed;padding:16px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:600}.metric strong{display:block;margin-top:8px;font-size:32px}.progress-track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:18px}.progress-bar{height:100%;background:var(--blue);width:0}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:0;color:var(--muted);font-size:13px}.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.month{border:1px solid var(--line);border-radius:14px;padding:16px;min-height:138px}.month.current{border-color:#0071e366;background:#f7fbff}.month-head{display:flex;justify-content:space-between;gap:12px}.month h3{margin:0;font-size:17px}.count{color:var(--blue);font-size:12px;font-weight:700}.presenters{display:grid;gap:6px;margin-top:12px}.person,.anonymous{border-radius:999px;background:var(--soft);padding:6px 10px;font-size:12px}.empty{color:var(--muted);font-size:13px;margin-top:14px}.warning{border:1px solid #ead38c;background:#fff8dc;border-radius:14px;padding:13px 16px;color:#684f00;margin-bottom:12px}.error{text-align:center;color:var(--muted);padding:30px}@media(max-width:760px){.shell{width:min(100% - 24px,1100px);padding-top:24px}.top h1{font-size:36px}.summary,.months{grid-template-columns:1fr 1fr}}@media(max-width:480px){.summary,.months{grid-template-columns:1fr}}
.featured{position:relative;overflow:hidden;border:0;background:var(--navy);color:#fff;text-align:center;padding:42px 28px}.featured::before,.featured::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#4a8fe755 0 2px,transparent 3px);background-size:22px 22px;transform:rotate(18deg)}.featured::before{left:-35px;top:-40px}.featured::after{right:-30px;bottom:-50px}.featured-label{position:relative;margin:0;color:#8fbaff;font-weight:700}.featured h2{position:relative;margin:6px 0 24px;font-size:34px}.featured-people{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:780px;margin:auto}.featured-person strong{display:block;color:var(--yellow);font-size:28px}.featured-person span{display:block;margin-top:5px;color:#bed3f2;font-size:13px}.person{display:grid;border-radius:10px}.person-meta{color:var(--muted);font-size:11px}.anonymous{display:block;border-radius:10px}.month.current{border-color:#2467c966;background:#f5f9ff}@media(max-width:760px){.featured-people{grid-template-columns:1fr}.featured{padding:34px 20px}.featured h2{font-size:28px}.featured-person strong{font-size:24px}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><p class="eyebrow">Culture Master Rotation</p><h1>CM 발표 일정</h1><p class="lead" id="cycle-label">발표자 순환 정보를 불러오는 중입니다.</p></div>
    <a class="back" href="index.html">활동 아카이브</a>
  </header>
  <div id="warnings"></div>
  <section class="panel featured" id="featured" hidden></section>
  <section class="panel" aria-label="발표 순환 현황">
    <div class="summary" id="summary"></div>
    <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
  </section>
  <section class="panel">
    <div class="section-head"><h2>월별 일정</h2><p id="privacy-label"></p></div>
    <div class="months" id="months"></div>
  </section>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const current=new Date().toISOString().slice(0,7);
fetch("data/presenter-rotation.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
  const c=data.cycle,s=data.summary,total=s.eligibleCount||0,done=s.completedCount||0;
  document.getElementById("cycle-label").textContent=`${c.startMonth}부터 ${c.endMonth}까지 · 매월 ${c.monthlyTarget}명 · ${c.planningEndMonth}까지 일정 확정`;
  const metrics=[["대상",total],["발표 완료",done],["발표 예정",s.scheduledCount],["남은 인원",s.remainingCount]];
  document.getElementById("summary").innerHTML=metrics.map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("");
  document.getElementById("progress").style.width=`${total?Math.min(100,done/total*100):0}%`;
  document.getElementById("privacy-label").textContent=c.showNames?"발표자의 이름과 소속을 표시합니다.":"개인정보 보호를 위해 인원 수만 표시합니다.";
  document.getElementById("warnings").innerHTML=(data.warnings||[]).map(w=>`<div class="warning">${esc(w)}</div>`).join("");
  const months=data.months||[];
  const featured=months.find(m=>m.month>=current&&m.assignedCount>0)||months.findLast?.(m=>m.assignedCount>0);
  if(featured){
    const el=document.getElementById("featured"),people=c.showNames?(featured.presenters||[]).map(p=>`<div class="featured-person"><strong>${esc(p.name)}</strong><span>${esc([p.department,p.jobTitle].filter(Boolean).join(" · ")||"CM 발표자")}</span></div>`).join(""):`<div class="featured-person"><strong>${esc(featured.assignedCount)}명</strong><span>발표 예정</span></div>`;
    el.innerHTML=`<p class="featured-label">${esc(featured.month.replace("-","."))} CM 발표자</p><h2>발표 일정을 확인해 주세요</h2><div class="featured-people">${people}</div>`;
    el.hidden=false;
  }
  document.getElementById("months").innerHTML=months.length?months.map(m=>{
    const people=c.showNames?(m.presenters||[]).map(p=>`<span class="person"><b>${esc(p.name)} · ${p.status==="completed"?"완료":"예정"}</b><span class="person-meta">${esc([p.department,p.jobTitle].filter(Boolean).join(" · "))}</span></span>`).join(""):(m.assignedCount?`<span class="anonymous">배정 ${esc(m.assignedCount)}명</span>`:"");
    return `<article class="month${m.month===current?" current":""}"><div class="month-head"><h3>${esc(m.month)}</h3><span class="count">${esc(m.assignedCount)}명 배정</span></div><div class="presenters">${people||'<span class="empty">아직 배정되지 않았습니다.</span>'}</div></article>`;
  }).join(""):'<p class="empty">임직원 명부를 동기화하면 일정이 표시됩니다.</p>';
}).catch(()=>{document.getElementById("summary").innerHTML='<p class="error">발표 일정 데이터를 불러오지 못했습니다.</p>'});
</script>
</body>
</html>
