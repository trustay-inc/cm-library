<style>
:root{--navy:#102a50;--blue:#2467c9;--pale:#e8f2fc;--bg:#f3f6fa;--line:#d8e0eb;--text:#11213a;--muted:#70809a;--yellow:#ffd24a;--sans:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45}.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--navy);color:#fff;padding:23px 12px;display:flex;flex-direction:column}.brand{padding:0 4px 22px}.brand strong{display:block;font-size:20px}.brand span{color:#7fa8df;font-size:10px}.nav{display:grid;gap:6px}.nav a,.nav span{display:block;border-radius:9px;padding:10px 14px;color:#dce8f8;text-decoration:none;font-size:14px;font-weight:600}.nav .active{background:#244a7d;color:#fff;border-left:3px solid #63a7ff}.side-foot{margin-top:auto;color:#7695bd;font-size:10px;padding:0 4px}.main{padding:20px 28px 40px;min-width:0}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:16px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.admin-actions{display:flex;gap:8px}.button{display:inline-block;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:11px 16px;font:700 14px var(--sans);text-decoration:none;cursor:pointer}.button.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}.button:disabled{opacity:.45}.draw-card,.table-card,.summary-card{border:1px solid var(--line);border-radius:12px;background:#fff}.draw-card{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;padding:14px;margin-bottom:16px}.stage{min-height:112px;border-radius:9px;background:linear-gradient(135deg,#102a50,#173a67);color:#8fb5e7;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}.stage strong{display:block;color:#fff;font-size:21px;margin-bottom:5px}.stage-people{display:flex;flex-wrap:wrap;justify-content:center;gap:22px}.stage-person b{display:block;color:var(--yellow);font-size:22px}.stage-person span{font-size:11px}.controls{display:flex;flex-direction:column;justify-content:center;gap:9px}.controls label{font-size:12px;font-weight:700}.controls select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.controls .button{width:100%}.notice{display:none;border:1px solid #f0d477;background:#fff8d8;color:#695000;border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:12px}.notice.show{display:block}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.summary-card{padding:13px 15px}.summary-card span{display:block;color:var(--muted);font-size:11px}.summary-card strong{display:block;margin-top:3px;font-size:24px}.tables{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table-card{overflow:hidden}.table-title{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}.table-scroll{max-height:490px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:#edf2f8;color:#44536c;text-align:left}th,td{padding:9px 12px;border-bottom:1px solid var(--line)}tbody tr.completed{background:var(--pale)}td.month{color:#1857a8;font-weight:700;white-space:nowrap}td.name{font-weight:700;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:34px}.result-dialog{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;background:var(--navy);color:#fff;text-align:center;padding:0}.result-dialog::backdrop{background:var(--navy)}.result-inner{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;overflow:hidden}.result-inner::before{content:"";position:absolute;inset:-80px;background-image:radial-gradient(circle,#ffd24a 0 3px,transparent 4px),radial-gradient(circle,#74d8c <body><div class="app"><aside class="sidebar"><div class="brand"><strong>CM 관리</strong><span>CULTURE MASTER</span></div><nav class="nav"><a class="active" href="rotation.html">CM 추첨</a><a href="index.html">활동 아카이브</a><span>재직자</span><span>CM 설정</span></nav><div class="side-foot">CM Library</div></aside>
<main class="main"><header class="page-head"><div><h1>CM 추첨</h1><p id="cycle-label">발표자 정보를 불러오는 중입니다.</p></div><div class="admin-actions"><button class="button secondary" id="admin-login">관리자 로그인</button><a class="button secondary" href="https://github.com/trustay-inc/cm-library/actions/workflows/update-presenter-rotation.yml" target="_blank" rel="noreferrer">Action 열기</a></div></header><div class="notice" id="notice"></div>
<section class="draw-card"><div class="stage" id="stage">활동년월을 선택하고 발표자를 확인하세요.</div><div class="controls"><label for="month-select">활동년월</label><select id="month-select"></select><button class="button" id="show-result">🎲 3명 발표자 확인</button><button class="button secondary admin-only" id="draw-month" hidden>이 달 추첨</button><button class="button secondary admin-only" id="edit-completions" hidden>완료자 편집</button></div></section>
<section class="summary" id="summary"></section><section class="tables"><article class="table-card"><h2 class="table-title">발표 완료자</h2><div class="table-scroll"><table><thead><tr><th>활동월</th><th>이름</th><th>소속</th><th>직급</th></tr></thead><tbody id="completed-table"></tbody></table></div></article><article class="table-card"><h2 class="table-title">발표 예정자</h2><div class="table-scroll"><table><thead><tr><th>활동월</th><th>이름</th><th>소속</th><th>직급</th></tr></thead><tbody id="scheduled-table"></tbody></table></div></article></section></main></div>
<dialog class="result-dialog" id="result-dialog"><div class="result-inner"><div class="result-content" id="result-content"></div><button class="result-close" id="result-close">화면을 클릭하거나 Esc를 누르면 닫힙니다</button></div></dialog><dialog class="editor" id="completion-editor"><div class="editor-head"><h2 id="editor-title">완료자 편집</h2></div><div class="editor-body" id="editor-fields"></div><div class="editor-actions"><button class="button secondary" id="editor-cancel">취소</button><button class="button" id="editor-save">Sheet에 저장</button></div></dialog>
