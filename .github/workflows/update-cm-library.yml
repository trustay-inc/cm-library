name: CM Library 갱신

# 매주 실행한다. 스크립트가 폴더에서 "가장 최신 타운홀 덱"을 찾고,
# 그 월이 이미 activities.json에 있으면 아무것도 하지 않는다.
# 이렇게 두면 타운홀이 월 중순에 열려도, 일정이 밀려도 알아서 따라간다.
# 날짜 계산에 의존하지 않으므로 한 달을 통째로 놓치는 실패가 사라진다.
on:
  push:
    branches: [main]        # PR이 merge된 직후 사이트를 바로 재배포하기 위함
  schedule:
    - cron: "0 1 * * 1"     # 매주 월요일 10:00 KST
  workflow_dispatch:
    inputs:
      month:
        description: "특정 월을 강제로 처리 (YYYY.MM). 비우면 최신 덱"
        required: false

permissions:
  contents: write
  id-token: write            # Workload Identity Federation에 필요

jobs:
  update:
    # push(=PR merge 직후 재배포 트리거)는 새 덱을 찾는 용도가 아니다.
    # 여기서 또 추출/요약을 돌리면 Gemini 무료 티어 호출만 낭비된다.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 서비스 계정 키(JSON)를 쓰지 않는다. GitHub OIDC 토큰으로
      # 매 실행마다 단기 토큰을 발급받는다. 장기 자격증명이 저장소에 남지 않는다.
      - name: Google 인증
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 종료코드 4(그 달 CM 발표 없음)는 정상적인 no-op이다 — 실패로 취급하지
      # 않는다. 그 외 0이 아닌 코드(구조 깨짐 등)는 그대로 실패시킨다.
      - name: CM 블록 추출
        id: extract
        run: |
          set +e
          python scripts/extract_cm_block.py \
            ${{ inputs.month && format('--month {0}', inputs.month) || '' }} \
            --out build/cm_block.json
          code=$?
          set -e
          if [ "$code" -eq 4 ]; then
            echo "이번 달은 CM 발표가 없다 (정상) — no-op으로 종료"
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 요약 후 병합
        id: summarize
        if: steps.extract.outputs.found == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/summarize_to_json.py --block build/cm_block.json

      # 자동 커밋이 아니라 브랜치만 push한다. 조직 정책상 GitHub Actions가
      # PR을 직접 여는 게 막혀 있어서(트러스테이 조직 설정), "PR 열기"는
      # 아래 Slack 알림의 링크를 사람이 클릭해서 한다. 사람이 diff를 한 번
      # 보고 Merge하게 만드는 마지막 관문이라는 목적은 그대로 유지된다.
      - name: 브랜치 push
        if: steps.summarize.outputs.changed == 'true'
        run: |
          BRANCH="cm-library/${{ steps.summarize.outputs.month }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/activities.json
          git commit -m "CM Library: ${{ steps.summarize.outputs.month }} 추가"
          git push -f origin "$BRANCH"

      # PR 생성 API를 못 쓰니, compare 페이지 링크(제목/본문을 쿼리 파라미터로
      # 미리 채워둠)를 Slack으로 보낸다. 링크를 열고 "Create pull request"만
      # 누르면 된다.
      - name: Slack 알림
        if: steps.summarize.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MONTH: ${{ steps.summarize.outputs.month }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          if not os.environ.get("SLACK_WEBHOOK_URL"):
              print("SLACK_WEBHOOK_URL 시크릿이 없다 — 알림을 건너뛴다. "
                    "브랜치는 이미 push됐으니 데이터는 안전하다.")
              sys.exit(0)

          month = os.environ["MONTH"]
          branch = f"cm-library/{month}"
          title = f"CM Library: {month} 활동 추가"
          body = (
              f"타운홀 덱에서 자동 추출한 {month} CM 활동입니다.\n\n"
              "**Merge 전에 확인해 주세요**\n"
              "- [ ] 목적과 회고가 실제 발표 내용과 맞는지\n"
              "- [ ] 참여자 이름이 정확한지\n"
              "- [ ] CM과 무관한 내용(사업 지표, 인사 정보)이 섞이지 않았는지\n"
              "- [ ] public 사이트에 나가도 되는 내용인지"
          )
          query = urllib.parse.urlencode({"quick_pull": "1", "title": title, "body": body})
          pr_url = f"https://github.com/{os.environ['REPO']}/compare/main...{branch}?{query}"

          text = (
              f"🆕 CM Library: {month} 활동 발견\n"
              "조직 정책상 Actions가 PR을 못 열어서 링크로 대신 보냅니다 — "
              f"열어서 diff 확인 후 PR 만들어주세요.\n{pr_url}"
          )
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": text}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req)
          PYEOF

  deploy:
    needs: update
    # update가 push 트리거라서 스킵됐어도(=skipped) 배포는 진행해야 한다.
    # 진짜 실패(update가 failure/cancelled)일 때만 배포를 막는다.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
