name: CM 발표 일정 갱신

on:
  schedule:
    - cron: "10 1 * * *" # 매일 10:10 KST
  workflow_dispatch:
    inputs:
      operation:
        description: "작업"
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - auto-draw
          - draw
          - set-completions
      month:
        description: "대상 월 (YYYY-MM, refresh는 비워도 됨)"
        required: false
        type: string
      presenters:
        description: "완료자 이름 또는 ID, 쉼표 구분 (set-completions 전용)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPERATION: ${{ github.event_name == 'schedule' && 'auto-draw' || inputs.operation || 'refresh' }}
    steps:
      - uses: actions/checkout@v4

      - name: 설정 확인
        id: config
        env:
          CM_ROSTER_SHEET_ID: ${{ secrets.CM_ROSTER_SHEET_ID }}
        run: |
          if [ -z "$CM_ROSTER_SHEET_ID" ]; then
            echo "CM_ROSTER_SHEET_ID가 없어 갱신을 건너뜁니다."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.config.outputs.configured == 'true'

      - name: Google 인증
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 발표 일정 생성
        if: steps.config.outputs.configured == 'true'
        env:
          CM_ROSTER_SHEET_ID: ${{ secrets.CM_ROSTER_SHEET_ID }}
          MONTH: ${{ inputs.month }}
          PRESENTERS: ${{ inputs.presenters }}
        run: |
          args=(--sheet-id "$CM_ROSTER_SHEET_ID" --operation "$OPERATION")
          if [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          if [ -n "$PRESENTERS" ]; then args+=(--presenters "$PRESENTERS"); fi
          python scripts/manage_presenter_rotation.py "${args[@]}"

      - name: 변경 확인
        if: steps.config.outputs.configured == 'true'
        id: diff
        run: |
          if git diff --quiet -- data/presenter-rotation.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 추첨·완료 변경 main 반영
        if: >-
          steps.diff.outputs.changed == 'true' &&
          env.OPERATION != 'refresh'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/presenter-rotation.json
          git commit -m "CM Library: 발표 일정 자동 반영"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 검토 브랜치 push
        if: >-
          steps.diff.outputs.changed == 'true' &&
          env.OPERATION == 'refresh'
        run: |
          BRANCH="cm-library/presenter-rotation"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/presenter-rotation.json
          git commit -m "CM Library: 발표 일정 갱신"
          git push -f origin "$BRANCH"

      - name: Slack 검토 알림
        if: >-
          steps.diff.outputs.changed == 'true' &&
          env.OPERATION == 'refresh'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.parse
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL")
          if not webhook:
              print("SLACK_WEBHOOK_URL이 없어 알림만 건너뜁니다.")
              raise SystemExit(0)

          branch = "cm-library/presenter-rotation"
          query = urllib.parse.urlencode({
              "quick_pull": "1",
              "title": "CM Library: 발표 일정 갱신",
              "body": "중복 발표, 유예 대상, 공개 이름을 확인한 뒤 병합해 주세요.",
          })
          url = f"https://github.com/{os.environ['REPO']}/compare/main...{branch}?{query}"
          request = urllib.request.Request(
              webhook,
              data=json.dumps({"text": f"CM 발표 일정이 변경되었습니다. diff 확인 후 PR을 만들어 주세요.\n{url}"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(request)
          PYEOF
